<style>
/* Layout: a full-bleed night-sky network; Bob fixed at the centre; reference entries slide in from the right (bottom sheet on phones). Single deliberate dark theme. */
:root {
  color-scheme: dark;
  --sky: #070910;
  --sky-2: #0e1220;
  --ink: #e9e4d8;
  --ink-dim: #9a9aa8;
  --rule: #262b3d;
  --gold: #f0c36a;      /* people */
  --lapis: #6fa8ff;     /* concepts */
  --violet: #b892ff;    /* texts */
  --jade: #6fd6a8;      /* places */
  --ember: #ff9a62;     /* events */
  --rose: #ff7fae;      /* stories */
  --star: #c9cbe0;      /* moments */
  --open: #6fd6a8; --registered: #f0c36a; --restricted: #ff7f7f;
  --display: "Spectral", "Iowan Old Style", Georgia, serif;
  --ui: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; }
body { margin: 0; background: var(--sky); color: var(--ink); font-family: var(--ui); font-size: 14px; overflow: hidden; }
#stage, #stage3d { position: fixed; inset: 0; }
#stage, #stage3d { z-index: 0; }
#stage3d { background: var(--sky); isolation: isolate; }
.masthead, .legend, .hint { z-index: 5; }
.tip3 { display: grid; gap: 2px; background: rgba(14,18,32,.92); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; font: 500 12.5px var(--ui); color: var(--ink); }
.tip3 span { color: var(--ink-dim); font-size: 11px; font-weight: 400; }
canvas { display: block; width: 100%; height: 100%; cursor: grab; }
canvas.pointing { cursor: pointer; }

.masthead { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 18px); left: 20px; right: 20px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-start; pointer-events: none; }
.masthead > * { pointer-events: auto; }
.title { display: grid; gap: 2px; margin-right: auto; }
.title h1 { margin: 0; font-family: var(--display); font-weight: 300; font-size: clamp(26px, 4vw, 38px); letter-spacing: .01em; text-wrap: balance; }
.title h1 i { font-weight: 300; color: var(--gold); }
.title p { margin: 0; color: var(--ink-dim); font-size: 12.5px; letter-spacing: .04em; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.search { position: relative; }
.search input { width: min(240px, 60vw); background: rgba(14,18,32,.85); border: 1px solid var(--rule); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: inherit; }
.search input:focus { outline: 2px solid var(--lapis); outline-offset: 1px; }
.btn { background: rgba(14,18,32,.85); border: 1px solid var(--rule); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: inherit; cursor: pointer; }
.btn:hover { border-color: var(--ink-dim); }
.btn:focus-visible, .chip:focus-visible, .row:focus-visible { outline: 2px solid var(--lapis); outline-offset: 2px; }
#results { position: absolute; top: 40px; left: 0; width: 280px; max-height: 50vh; overflow: auto; background: var(--sky-2); border: 1px solid var(--rule); border-radius: 10px; padding: 4px; z-index: 5; }

.legend { position: fixed; left: 20px; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100vw - 40px); }
.chip { display: inline-flex; align-items: center; gap: 7px; background: rgba(14,18,32,.8); border: 1px solid var(--rule); color: var(--ink); border-radius: 999px; padding: 5px 11px 5px 9px; font: 500 12px var(--ui); cursor: pointer; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.chip[aria-pressed="false"] { opacity: .38; }
.chip .n { color: var(--ink-dim); font-family: var(--mono); font-size: 11px; }

aside#panel { box-sizing: border-box; position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: linear-gradient(180deg, rgba(14,18,32,.97), rgba(7,9,16,.98)); border-left: 1px solid var(--rule); padding: calc(env(safe-area-inset-top, 0px) + 22px) 24px calc(env(safe-area-inset-bottom, 0px) + 28px); overflow-y: auto; transform: translateX(105%); transition: transform .28s ease; z-index: 10; }
aside#panel.open { transform: none; }
@media (max-width: 700px) {
  aside#panel { top: auto; width: 100vw; height: 62vh; border-left: 0; border-top: 1px solid var(--rule); border-radius: 16px 16px 0 0; transform: translateY(105%); padding-left: 18px; padding-right: 18px; }
  .masthead { left: 16px; right: 16px; }
  .legend { left: 16px; max-width: calc(100vw - 32px); }
}
@media (prefers-reduced-motion: reduce) { aside#panel { transition: none; } }
.close { position: sticky; top: 0; float: right; margin: -6px -8px 0 8px; }
.eyebrow { font: 600 11px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--c, var(--ink-dim)); }
#panel h2 { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.15; margin: 6px 0 12px; text-wrap: balance; }
#panel h3 { font: 600 11px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); margin: 22px 0 8px; }
#panel p { line-height: 1.6; margin: 0 0 10px; color: #d6d2c8; max-width: 62ch; }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
dl.facts dt { color: var(--ink-dim); font-size: 12px; }
dl.facts dd { margin: 0; min-width: 0; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.skt { font-family: var(--display); font-style: italic; font-size: 16px; }
blockquote { margin: 12px 0; padding: 2px 0 2px 14px; border-left: 2px solid var(--c, var(--gold)); font-family: var(--display); font-style: italic; font-size: 17px; line-height: 1.5; color: var(--ink); }
blockquote cite { display: block; font: 400 12px var(--ui); font-style: normal; color: var(--ink-dim); margin-top: 4px; }
.list { display: grid; gap: 2px; }
.row { display: grid; grid-template-columns: 62px 1fr; gap: 10px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
.row:hover { background: rgba(255,255,255,.05); }
.row .t { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.row .k { display: block; font-size: 11.5px; color: var(--ink-dim); margin-top: 2px; }
.row.simple { grid-template-columns: 14px 1fr; }
.row.simple .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-top: 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .chip { font-weight: 400; }
.badge { display: inline-block; font: 600 10.5px var(--ui); letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; border: 1px solid currentColor; }
.tier1 { color: var(--open); } .tier2 { color: var(--registered); } .tier3 { color: var(--restricted); }
.note { font-size: 12.5px; color: var(--ink-dim); border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 22px; line-height: 1.55; }
table.mini { width: 100%; border-collapse: collapse; font-size: 13px; }
table.mini td, table.mini th { text-align: left; padding: 6px 6px 6px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.mini th { color: var(--ink-dim); font-weight: 500; font-size: 11.5px; }
.tablewrap { overflow-x: auto; }
.plate { margin: 4px 0 16px; }
.plate img { display: block; width: 100%; max-height: 260px; object-fit: cover; border-radius: 10px; border: 1px solid var(--rule); background: var(--sky-2); }
.plate .crop { width: 100%; max-width: 260px; aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--rule); background-color: var(--sky-2); background-repeat: no-repeat; }
.plate figcaption { font-size: 11.5px; color: var(--ink-dim); margin-top: 6px; line-height: 1.45; }
.plate figcaption a { color: var(--ink-dim); }
.plate .blockednote { display: none; }
.plate.blocked img { display: none; }
.plate.blocked .blockednote { display: inline; }
.rels { display: grid; gap: 2px; }
.rel { padding: 7px 0; border-top: 1px solid var(--rule); font-size: 13.5px; line-height: 1.5; }
.rel .verb { color: var(--ink-dim); }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--lapis); cursor: pointer; text-align: left; }
.linkish.strong { color: var(--ink); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.linkish.strong .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.cite { border-top: 1px solid var(--rule); padding: 10px 0 4px; }
.cite p { margin: 4px 0 6px; font-size: 13.5px; }
.cite .k, .k { color: var(--ink-dim); font-size: 12px; }
.badge.rel { color: var(--violet); }
a { color: var(--lapis); }
.hint { position: fixed; right: 20px; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); color: var(--ink-dim); font-size: 12px; pointer-events: none; }
@media (max-width: 700px) { .hint { display: none; } }
</style>

 "cite": "29:11"}, {"id": "event:harvard-seminar", "label": "Dalai Lama's Harvard seminar, translated by Jeffrey Hopkins", "date": "1981", "cite": "21:35"}, {"id": "event:wisdom-compassion", "label": "Wisdom and Compassion exhibition: San Francisco, New York, London and on", "date": "1991–92", "cite": "16:20"}, {"id": "event:festschrift-70", "label": "Festschrift for Bob's 70th birthday", "date": "70th birthday 2011; book 2015", "cite": "1:35:58"}, {"id": "event:email-2018-2023", "label": "Clear-light email exchange, Bob and David Kittay", "date": "2018–2023", "cite": "53:40"}, {"id": "event:menla-memorial", "label": "Memorial at Menla", "date": "2026", "cite": "6:06"}, {"id": "event:crossing-himalayas", "label": "'Crossing the Himalayas' exhibition opening, Taiwan", "date": "Oct 2026", "cite": "15:22"}], "passages": [{"id": "p01", "start": "0:00", "end": "0:57", "kind": "framing", "title": "Welcome", "summary": "Ganden Thurman, Bob's eldest son and Tibet House board president, opens the series and credits David Kittay with assembling it.", "tier": 1, "evidence": "context", "speakers": ["agent:thurman-ganden"], "agents": ["agent:kittay-david"], "places": ["place:tibet-house-us"], "subjects": []}, {"id": "p02", "start": "0:57", "end": "5:54", "kind": "remembrance", "title": "How brilliant was Bob?", "summary": "David lists the forms of Bob's brilliance: vocabulary, Tibetan and Sanskrit, history, politics, energy, planning and spontaneity, ethics, friendship, and his love for Nena. He tells of Bob's speech at his son's engagement and reads a 2016 dream in which Bob initiates him.", "quote": "Bob loved life like, you know, like maybe nobody I've ever met.", "quoteAt": "3:00", "tier": 2, "evidence": "reported", "speakers": ["agent:kittay-david"], "subjects": ["subject:transformation"], "agents": ["agent:thurman-nena"], "places": ["place:burning-man", "place:columbia"], "stories": ["s-dream", "s-engagement"]}, {"id": "p03", "start": "5:54", "end": "9:31", "kind": "remembrance", "title": "The wild young professor", "summary": "Joe met Bob 53 years ago in his first religion class: one glass eye, wild hair, flower tie. At the open house in Woodstock Bob was building his own house. Joe recalls his old teacher's line: never trust a philosopher who isn't also a plumber.", "quote": "It was clear Bob was really from somewhere.", "quoteAt": "8:06", "tier": 1, "evidence": "reported", "speakers": ["agent:loizzo-joe"], "places": ["place:woodstock", "place:menla", "place:amherst"], "stories": ["s-first-class", "s-woodstock"], "subjects": []}, {"id": "p04", "start": "9:31", "end": "13:20", "kind": "framing", "title": "A holographic Bob: the series plan", "summary": "Joe outlines the sessions to come: Madhyamaka (from Bob's work on The Central Philosophy of Tibet), Tantric Bob, Buddhist psychology, Tibetan medicine, mind training with Sharon Salzberg and Annie Bien, and Creative Bob with Laurie Anderson. The aim is a 'holographic' picture of Bob and a start on carrying his legacy forward.", "quote": "To give you a holographic Bob.", "quoteAt": "12:43", "tier": 1, "evidence": "context", "speakers": ["agent:loizzo-joe", "agent:kittay-david"], "subjects": ["subject:madhyamaka", "subject:tantra", "subject:psychology", "subject:mind-training"], "agents": ["agent:yarnall-tom", "agent:campbell-john", "agent:jennings-pilar", "agent:salzberg-sharon", "agent:bien-annie", "agent:anderson-laurie"], "places": ["place:columbia"], "works": ["work:central-philosophy", "work:love-your-enemies"]}, {"id": "p05", "start": "13:20", "end": "18:01", "kind": "institutional history", "title": "How Tibet House began", "summary": "Beata's 30-year history with Tibet House: it started in a single brownstone office on 32nd Street, for a time shared with Students for a Free Tibet. The early-1990s Wisdom and Compassion exhibition toured 11 museums in 6 countries and is still cited as a standard, most recently at an exhibition in Taiwan. Her father helped secure a loan from the Hermitage.", "quote": "We were also saving Tibet. Let's not forget that.", "quoteAt": "17:31", "tier": 1, "evidence": "reported", "speakers": ["agent:tikos-beata"], "subjects": ["subject:tibetan-art", "subject:politics"], "agents": ["agent:dalai-lama-14", "agent:tikos-laszlo"], "places": ["place:tibet-house-us", "place:taiwan"], "events": ["event:wisdom-compassion", "event:crossing-himalayas"], "stories": ["s-brownstone", "s-hermitage"]}, {"id": "p06", "start": "18:01", "end": "19:13", "kind": "institutional history", "title": "Benefit concert and gifts", "summary": "Philip Glass and the benefit concert came from the same founding group. Many antiquities at Tibet House were gifts from people inspired by Bob's vision for an endangered culture.", "tier": 1, "evidence": "reported", "speakers": ["agent:tikos-beata"], "subjects": ["subject:tibetan-art", "subject:politics"], "agents": ["agent:glass-philip"], "places": ["place:tibet-house-us"]}, {"id": "p07", "start": "19:13", "end": "23:41", "kind": "magic moment", "title": "The yak story", "summary": "Beata walked into Bob's office before college wanting to learn Tibetan. Her first translation was a disappointing story about a yak falling off a roof. Within three months Bob brought her to help at the Dalai Lama's Harvard seminar, translated by Jeffrey Hopkins, where she was taught that emptiness can't be understood without relative reality.", "quote": "He taught me as though there were 20 people there.", "quoteAt": "20:55", "tier": 1, "evidence": "reported", "speakers": ["agent:tikos-beata"], "subjects": ["subject:tibetan-language", "subject:sunyata", "subject:pratityasamutpada"], "agents": ["agent:dalai-lama-14", "agent:hopkins-jeffrey"], "places": ["place:harvard"], "works": ["work:dalai-lama-harvard"], "events": ["event:harvard-seminar"], "stories": ["s-yak", "s-harvard"]}, {"id": "p08", "start": "23:41", "end": "27:22", "kind": "magic moment", "title": "Bob starts at the deep end", "summary": "Raised Catholic, the son of a psychiatrist, Joe arrived at Amherst with Jung. Bob taught tantra in the first class: Vajrayoginī, Yamāntaka, the Evans-Wentz translations. They read Nāgārjuna and Candrakīrti alongside Wittgenstein. For Joe, Madhyamaka cut the knot between materialist science and theism.", "quote": "This is Bob deep end.", "quoteAt": "24:41", "tier": 1, "evidence": "reported", "speakers": ["agent:loizzo-joe"], "subjects": ["subject:tantra", "subject:vajrayogini", "subject:yamantaka", "subject:madhyamaka", "subject:buddhist-science"], "agents": ["agent:jung", "agent:nagarjuna", "agent:candrakirti", "agent:wittgenstein"], "places": ["place:amherst", "place:gyuto"], "works": ["work:evans-wentz"], "stories": ["s-deep-end"]}, {"id": "p09", "start": "27:22", "end": "30:00", "kind": "magic moment", "title": "By tuk-tuk to Drepung", "summary": "In 1979, after dropping out of medical school, Joe travelled to India with the Thurmans. From Dharamsala Bob took him south to Drepung for a tantric retreat and initiation. The daily practice that came from it took him back to medical school.", "tier": 1, "evidence": "reported", "speakers": ["agent:loizzo-joe"], "subjects": ["subject:tantra", "subject:yamantaka"], "places": ["place:dharamsala", "place:drepung"], "events": ["event:1979-drepung"], "stories": ["s-drepung"]}, {"id": "p10", "start": "30:00", "end": "33:15", "kind": "family memory", "title": "Growing up, and why the jokes", "summary": "Ganden grew up among grad students, Tibetan refugee families and visiting lamas. Geshe Wangyal named him. Asked why he joked so much while lecturing, Bob said you never know if they've done the reading. Ganden links his humor to seeing emptiness and the constructed nature of things.", "quote": "Half the job is entertaining.", "quoteAt": "32:39", "tier": 1, "evidence": "reported", "speakers": ["agent:thurman-ganden"], "subjects": ["subject:humor", "subject:sunyata"], "agents": ["agent:wangyal-geshe"], "stories": ["s-name", "s-jokes"]}, {"id": "p11", "start": "33:15", "end": "36:44", "kind": "biography", "title": "The eye, the road, the refugees", "summary": "Ideas mattered to Bob, which Ganden sees as the source of his rigor and passion. Bob lost his eye in a fit of anger at a tire and then hitchhiked from Turkey to India in 1961. He was struck first by how Tibetan refugees handled their trauma, then by the teachers behind them: Tibet first, then Buddhism.", "quote": "First Tibet, then Buddhism.", "quoteAt": "36:25", "tier": 2, "evidence": "reported", "speakers": ["agent:thurman-ganden"], "subjects": ["subject:transformation"], "events": ["event:1961-journey"], "stories": ["s-eye"]}, {"id": "p12", "start": "36:44", "end": "40:20", "kind": "family memory", "title": "Taught to compete", "summary": "Candid family history: Bob's upbringing, estrangement from his brothers, two families that broke down, and a difficult relationship with a daughter. Ganden describes Buddhism as slowly teaching him gratitude, relationship and giving back.", "tier": 3, "tierReason": "Names living family members and private relationships. Family review before any access.", "evidence": "reported", "speakers": ["agent:thurman-ganden"], "subjects": ["subject:transformation"]}, {"id": "p13", "start": "40:20", "end": "42:08", "kind": "biography", "title": "King of the ogres", "summary": "Information becomes knowledge, and knowledge is meant to be applied in ethics. At a meeting with the Dalai Lama's courtiers someone called Bob an ogre; the Dalai Lama said no, he's king of the ogres. Bob's ferocity came from desperately wanting the dharma to help others as it had helped him.", "quote": "No, he's king of the ogres.", "quoteAt": "41:24", "tier": 2, "evidence": "reported", "speakers": ["agent:thurman-ganden"], "subjects": ["subject:transformation"], "agents": ["agent:dalai-lama-14"], "stories": ["s-ogre"]}, {"id": "p14", "start": "42:08", "end": "44:10", "kind": "framing", "title": "Fierce, in order to help", "summary": "David responds to Ganden and sets out the evening: a short film of Bob teaching, then small-group sharing. The series is meant to be collective.", "tier": 1, "evidence": "context", "speakers": ["agent:kittay-david"], "subjects": []}, {"id": "p15", "start": "44:10", "end": "49:41", "kind": "correspondence", "title": "\"What is clear light?\"", "summary": "David shows emails in which he asks Bob, whom he called Kalachakra (Bob called him Komodo), whether 'I am clear light' means 'I don't exist.' Answering from an airport, Bob says emptiness is no more nothingness than everythingness, explains the four points of divine confidence, and ends in a long burst of ecstatic prose.", "quote": "Emptiness is not nothingness, or rather it is no more nothingness than it is everythingness.", "quoteAt": "46:14", "quoteBy": "Bob, read aloud from email", "tier": 2, "tierReason": "Private correspondence read aloud. The emails themselves are personal papers: inventory only.", "evidence": "primary (written, read aloud)", "bobVoice": "writing", "speakers": ["agent:kittay-david"], "subjects": ["subject:clear-light", "subject:sunyata", "subject:dissolution", "subject:divine-pride", "subject:pratityasamutpada"], "agents": ["agent:thurman-raf"], "events": ["event:email-2018-2023"], "stories": ["s-email"]}, {"id": "p16", "start": "49:41", "end": "53:29", "kind": "remembrance", "title": "The fire hose", "summary": "Bob wrote in capitals when excited. Nena was one of the first people who had to make his language legible. Asking Bob something was like drinking from a fire hose. David recalls Bob opening the Wisdom Is Bliss presentation with the story of Allen Ginsberg's farewell phone call. What the world needs now is Bob's energy and critical reason.", "quote": "It was a little bit like a fire hose.", "quoteAt": "51:17", "tier": 1, "evidence": "reported", "speakers": ["agent:kittay-david", "agent:loizzo-joe"], "subjects": ["subject:politics"], "agents": ["agent:thurman-nena", "agent:ginsberg-allen"], "works": ["work:wisdom-is-bliss"], "stories": ["s-ginsberg"]}, {"id": "p17", "start": "53:29", "end": "55:16", "kind": "comment", "title": "Still answering in 2023", "summary": "John notes that David's first email was from 2018 and Bob was still answering the same question in 2023. Conversations with Bob didn't end.", "tier": 1, "evidence": "reported", "speakers": ["agent:campbell-john", "agent:kittay-david"], "subjects": ["subject:clear-light"], "events": ["event:email-2018-2023"]}, {"id": "p18", "start": "55:16", "end": "1:01:25", "kind": "teaching (film)", "title": "Bob: why study Buddhism?", "summary": "Bob in his own voice. The Buddha's teaching is three higher educations, in ethics, mind and wisdom, which correspond to society, psychology and science. Study Buddhism as a set of scientific theories and tools for investigating reality, not as a religion. Ignorance is 'misknowing'. His slogan after 50 years of teaching: Buddhism is realism.", "quote": "Ultimately, Buddhism is realism.", "quoteAt": "1:00:28", "quoteBy": "Bob", "tier": 1, "tierReason": "Bob's own teaching. Source film not yet identified; rights follow the original.", "evidence": "primary (Bob speaking)", "lead": "Identify the source film of this clip and add it to Online_Inventory.", "bobVoice": "video", "speakers": ["agent:thurman-raf"], "subjects": ["subject:three-educations", "subject:eightfold-path", "subject:four-truths", "subject:avidya", "subject:buddhist-science"], "agents": ["agent:thurman-raf"]}, {"id": "p19", "start": "1:01:25", "end": "1:04:00", "kind": "framing", "title": "Into small groups", "summary": "David sends the room and the Zoom into breakout groups to discuss what Bob gave them and Buddhism as a toolkit for understanding reality. Wisdom and compassion are inseparable: seeing reality means seeing that we are connected.", "tier": 1, "evidence": "context", "speakers": ["agent:kittay-david"], "subjects": ["subject:wisdom-compassion", "subject:buddhist-science"]}, {"id": "p20", "start": "1:04:00", "end": "1:22:27", "kind": "gap", "title": "Breakout groups (not captured)", "summary": "About 18 minutes of crosstalk. The auto-transcript has only fragments. Don't transcribe; mark as a gap.", "tier": 3, "tierReason": "Private small-group conversation; no usable record.", "evidence": "none", "speakers": ["agent:participants"], "subjects": []}, {"id": "p21", "start": "1:22:27", "end": "1:26:45", "kind": "reflection", "title": "If it works on me, it's true", "summary": "Joe reports from his group, tying back to Ganden: for Bob ideas mattered existentially, and the dharma is only dharma if it relieves suffering. It worked on Bob, who became easier to live with and 'less of an ogre'. Ganden adds the tantric image of deities standing on impure impulses, and Buddhism's optimism about human nature.", "quote": "I'm less of an ogre.", "quoteAt": "1:24:59", "tier": 1, "evidence": "reported", "speakers": ["agent:loizzo-joe", "agent:thurman-ganden"], "subjects": ["subject:transformation", "subject:tantra"]}, {"id": "p22", "start": "1:26:45", "end": "1:29:37", "kind": "audience", "title": "Buddhism and politics", "summary": "An audience member links Buddhism's experiential critical education to politics and to its appeal under American capitalism. David widens this to China and Tibet and Tibet House's mission to preserve Tibetan culture.", "tier": 2, "tierReason": "Audience speaker; consent needed for open access.", "evidence": "reported", "speakers": ["agent:participants", "agent:kittay-david"], "subjects": ["subject:politics"]}, {"id": "p23", "start": "1:29:37", "end": "1:32:37", "kind": "reflection", "title": "Can I know reality?", "summary": "Joe: materialist science and theism both tell us we can't know reality ourselves; Buddhism says each of us can, which makes it politically empowering. Ganden cites Nāgārjuna's dictum that with emptiness everything works and without it nothing works.", "quote": "With emptiness everything works and without emptiness nothing works.", "quoteAt": "1:31:43", "tier": 1, "evidence": "reported", "speakers": ["agent:loizzo-joe", "agent:thurman-ganden"], "subjects": ["subject:buddhist-science", "subject:politics", "subject:sunyata"], "agents": ["agent:nagarjuna"]}, {"id": "p24", "start": "1:32:37", "end": "1:36:43", "kind": "reflection", "title": "Vimalakīrti Bob", "summary": "Tom's first readings with Bob were The Central Philosophy of Tibet and the Vimalakīrti Sūtra: critical thinking, and the wisdom that is compassion. He calls the sutra's vision magical realism. Emptiness is relativity, and relativity can be built into samsara or into a Buddha field. Bob lived that way, which is why Tom titled Bob's 70th-birthday festschrift 'In Vimalakīrti's House'.", "quote": "Once you've gone in, you never get back out.", "quoteAt": "1:36:19", "tier": 1, "evidence": "reported", "speakers": ["agent:yarnall-tom"], "subjects": ["subject:magical-realism", "subject:buddha-field", "subject:pratityasamutpada", "subject:tantra", "subject:madhyamaka"], "places": ["place:columbia"], "works": ["work:vimalakirti", "work:central-philosophy", "work:festschrift", "work:prajnaparamita"], "events": ["event:festschrift-70"]}, {"id": "p25", "start": "1:36:43", "end": "1:38:14", "kind": "remembrance", "title": "Periwinkle", "summary": "At Burning Man a participant chose the playa name Periwinkle, and Bob used it from then on. For David the lesson is that we create who we are by exercising the openness of reality.", "tier": 2, "tierReason": "Names an audience member.", "evidence": "reported", "speakers": ["agent:kittay-david"], "subjects": ["subject:sunyata", "subject:magical-realism"], "places": ["place:burning-man"], "stories": ["s-periwinkle"]}, {"id": "p26", "start": "1:38:14", "end": "1:40:22", "kind": "audience", "title": "Signed many times", "summary": "A longtime student says Bob's passing brought her back to the dharma. She carried her copy of the Vimalakīrti Sūtra on their travels and had Bob sign and date it again each time.", "tier": 2, "tierReason": "Audience speaker; consent needed.", "evidence": "reported", "lead": "A copy of Bob's Vimalakīrti signed many times, in private hands. Note as an object lead.", "speakers": ["agent:participants"], "works": ["work:holy-teaching"], "stories": ["s-signed"], "subjects": []}, {"id": "p27", "start": "1:40:22", "end": "1:43:19", "kind": "audience", "title": "Audience testimony (restricted)", "summary": "An audience member shares a personal health story in the language of 'magical reality'. Summarised here without detail.", "tier": 3, "tierReason": "Personal health disclosure by a private individual. Restricted; don't index the content.", "evidence": "reported", "speakers": ["agent:participants"], "subjects": ["subject:magical-realism"]}, {"id": "p28", "start": "1:43:19", "end": "1:47:28", "kind": "reflection", "title": "Translator Bob", "summary": "A chat comment praises Bob for replacing the older Latinate translation style with living language. David announces a future Translator Bob session. Joe lists Bob's choices: karma as 'evolution', bodhicitta as 'spirit of enlightenment', and dependent origination as 'relativity'. Bob took words from anywhere rather than shelving the dharma as an 'eastern religion'.", "quote": "Not let the Buddha Dharma be put in a cloister.", "quoteAt": "1:45:17", "tier": 1, "evidence": "reported", "speakers": ["agent:participants", "agent:kittay-david", "agent:loizzo-joe"], "subjects": ["subject:translation", "subject:karma", "subject:bodhicitta", "subject:pratityasamutpada", "subject:sahajananda"], "works": ["work:vimalakirti"]}, {"id": "p29", "start": "1:47:28", "end": "1:48:33", "kind": "audience", "title": "Honoring Nena", "summary": "A chat comment honors Bob's honoring of Nena and of women as bodhisattvas 'undercover'. David reports that Nena says that after he died Bob came back to tell her she'd been right about something they had argued over.", "tier": 2, "tierReason": "Family anecdote; family review.", "evidence": "reported", "speakers": ["agent:participants", "agent:kittay-david"], "agents": ["agent:thurman-nena"], "stories": ["s-nena"], "subjects": []}, {"id": "p30", "start": "1:48:33", "end": "1:49:50", "kind": "framing", "title": "Close", "summary": "Thanks to Joe, Ganden and Beata. Everyone is invited to continue at the Park Bar on 15th Street.", "tier": 1, "evidence": "context", "speakers": ["agent:kittay-david", "agent:loizzo-joe"], "subjects": []}], "stories": [{"id": "s-dream", "title": "David's 2016 dream of initiation by Bob", "teller": "agent:kittay-david", "at": "4:41"}, {"id": "s-engagement", "title": "Bob's speech at David's son's engagement", "teller": "agent:kittay-david", "at": "3:25"}, {"id": "s-first-class", "title": "Bob in Joe's first religion class", "teller": "agent:loizzo-joe", "at": "7:49"}, {"id": "s-woodstock", "title": "Open house in Woodstock; Bob building his own house", "teller": "agent:loizzo-joe", "at": "8:37"}, {"id": "s-brownstone", "title": "One office on 32nd Street", "teller": "agent:tikos-beata", "at": "15:04"}, {"id": "s-hermitage", "title": "Laszlo Tikos and the Hermitage loan", "teller": "agent:tikos-beata", "at": "16:41"}, {"id": "s-yak", "title": "The yak story", "teller": "agent:tikos-beata", "at": "19:42"}, {"id": "s-harvard", "title": "Harvard seminar with the Dalai Lama", "teller": "agent:tikos-beata", "at": "21:31"}, {"id": "s-deep-end", "title": "Tantra in the very first class", "teller": "agent:loizzo-joe", "at": "24:32"}, {"id": "s-drepung", "title": "By tuk-tuk to Drepung", "teller": "agent:loizzo-joe", "at": "28:07"}, {"id": "s-name", "title": "How Ganden got his names", "teller": "agent:thurman-ganden", "at": "31:23"}, {"id": "s-jokes", "title": "'You never know if they've done the reading'", "teller": "agent:thurman-ganden", "at": "32:30"}, {"id": "s-eye", "title": "The tire, the eye, and the road to India", "teller": "agent:thurman-ganden", "at": "34:09"}, {"id": "s-ogre", "title": "King of the ogres", "teller": "a ad.wikimedia.org/wikipedia/commons/thumb/a/af/Southern_Branch_of_the_National_Palace_Museum_main_building_and_zhimei_bridge.jpg/500px-Southern_Branch_of_the_National_Palace_Museum_main_building_and_zhimei_bridge.jpg", "title": "National Palace Museum Southern Branch, Chiayi", "creator": "B2322858", "source_url": "https://commons.wikimedia.org/wiki/File:Southern_Branch_of_the_National_Palace_Museum_main_building_and_zhimei_bridge.jpg", "license": "Public domain", "credit": "B2322858, via Wikimedia Commons (Public domain)", "rights_status": "cleared (open licence)", "cors": 1}, {"id": "img:040", "entity": "agent:kittay-david", "url": "https://shop.thus.org/cdn/shop/files/Dr-David-Kittay-Tibet-House-US-Menla-Online-2022-pwgfd80u9n8pj87u64ci3ve9ww55s1t4v2jwaux8e0.jpg?v=1736974001&width=500", "title": "Dr. David Kittay", "creator": "Tibet House US", "source_url": "https://shop.thus.org/pages/community-educator/david_kittay", "license": "All rights reserved (presumed)", "credit": "Photo: Tibet House US (permission to reuse pending)", "rights_status": "permission needed", "cors": 1}, {"id": "img:041", "entity": "agent:campbell-john", "url": "https://menla.secure.retreat.guru/wp-content/uploads/sites/56/2016/01/john-campbell-1-2.jpg", "title": "John Campbell", "creator": "Menla", "source_url": "https://menla.org/teachers/john-campbell/", "license": "All rights reserved (presumed)", "credit": "Photo: Menla (permission to reuse pending)", "rights_status": "permission needed", "cors": 0}]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.71.4/dist/3d-force-graph.min.js"></script>
<script>
(function () {
  const D = JSON.parse(document.getElementById('data').textContent);
  const css = getComputedStyle(document.documentElement);
  const tok = n => css.getPropertyValue(n).trim();

  const TYPES = {
    bob:     { label: 'Bob',      color: '#fff3d6' },
    person:  { label: 'People',   color: tok('--gold') },
    org:     { label: 'People',   color: tok('--gold') },
    concept: { label: 'Concepts', color: tok('--lapis') },
    work:    { label: 'Texts',    color: tok('--violet') },
    place:   { label: 'Places',   color: tok('--jade') },
    event:   { label: 'Events',   color: tok('--ember') },
    story:   { label: 'Stories',  color: tok('--rose') },
    moment:  { label: 'Moments',  color: tok('--star') },
    session: { label: 'Sessions', color: '#ffffff' }
  };
  const GROUPS = ['person', 'concept', 'work', 'place', 'event', 'story', 'moment', 'session'];
  const groupOf = t => (t === 'org' ? 'person' : t);

  // ---------- build graph ----------
  const nodes = [], links = [], byId = new Map(), seen = new Set();
  const add = (id, type, label, data) => { if (byId.has(id)) return byId.get(id); const n = { id, type, label, data: data || {} }; nodes.push(n); byId.set(id, n); return n; };
  const link = (a, b, kind) => {
    if (!byId.has(a) || !byId.has(b) || a === b) return;
    const k = a < b ? a + '|' + b : b + '|' + a; if (seen.has(k)) return; seen.add(k);
    links.push({ source: a, target: b, kind });
  };
  const toSec = s => s.split(':').reduce((t, v) => t * 60 + (+v), 0);

  D.agents.forEach(a => add(a.id, a.id === 'agent:thurman-raf' ? 'bob' : 'person', a.name, a));
  add('org:tibet-house-us', 'org', 'Tibet House US', { role: 'Publisher of the series; founded with Bob' });
  D.subjects.forEach(s => add(s.id, 'concept', s.en, s));
  D.works.forEach(w => add(w.id, 'work', w.title, w));
  D.places.forEach(p => add(p.id, 'place', p.name, p));
  D.events.forEach(e => add(e.id, 'event', e.label, e));
  D.stories.forEach(s => add(s.id, 'story', s.title, s));
  D.series.sessions.forEach((s, i) => add('session:' + (s.n || 'x' + i), 'session', s.title, s));
  D.passages.forEach(p => add(p.id, 'moment', p.title, p));

  const S1 = 'session:1';
  const CITES = D.citations || [];
  const RELS = D.relations || [];
  RELS.forEach(r => link(r.subject, r.object, 'bio'));
  CITES.forEach(c => link(c.passage, c.target, 'cites'));
  D.subjects.forEach(s => (s.loci || []).forEach(l => link(s.id, l.work, 'locus')));
  D.works.forEach(w => { if (w.translationOf) link(w.id, w.translationOf, 'translation'); (w.related || []).forEach(r => link(w.id, r, 'related')); });
  D.passages.forEach(p => {
    link(p.id, 'agent:thurman-raf', 'about');
    link(p.id, S1, 'part');
    (p.speakers || []).forEach(x => link(p.id, x, 'speaks'));
    ['subjects', 'agents', 'places', 'works', 'events', 'stories'].forEach(f => (p[f] || []).forEach(x => link(p.id, x, 'mentions')));
  });
  D.stories.forEach(s => link(s.id, s.teller, 'tells'));
  D.series.sessions.forEach((s, i) => (s.people || []).forEach(x => link('session:' + (s.n || 'x' + i), x, 'presents')));
  link(S1, 'org:tibet-house-us', 'hosts');
  D.series.sessions.forEach((s, i) => { if (!s.cite) return; const t = toSec(s.cite);
    const p = D.passages.find(p => toSec(p.start) <= t && t < toSec(p.end)); if (p) link('session:' + (s.n || 'x' + i), p.id, 'mentions'); });
  link('place:tibet-house-us', 'org:tibet-house-us', 'same');

  const nbrs = new Map(nodes.map(n => [n.id, new Set()]));
  links.forEach(l => { nbrs.get(l.source).add(l.target); nbrs.get(l.target).add(l.source); });
  nodes.forEach(n => {
    n.deg = nbrs.get(n.id).size;
    n.r = n.type === 'bob' ? 22 : n.type === 'moment' ? 2.6 + Math.sqrt(n.deg) * .9 : n.type === 'session' ? 6 + Math.sqrt(n.deg) * 1.2 : 3.2 + Math.sqrt(n.deg) * 2.1;
    n.color = TYPES[n.type].color;
  });

  const srcRect = (n, im) => { const c = n.data.imageCrop; if (!c) return [0, 0, im.naturalWidth || im.width, im.naturalHeight || im.height]; const W0 = im.naturalWidth || im.width, H0 = im.naturalHeight || im.height; return [c[0] * W0, c[1] * H0, c[2] * W0, c[3] * H0]; };
  const imgUrl = u => /^https?:/.test(u) ? u + (u.includes('?') ? '&' : '?') + 'cors=1' : u;
  // optional node images (data.image: data URI or relative path)
  nodes.forEach(n => { if (n.data.image) { const im = new Image(); if (n.data.imageCors !== false) im.crossOrigin = 'anonymous'; im.onload = () => { n.r = Math.max(n.r, n.type === 'bob' ? 26 : 9); draw(); }; im.src = n.data.imageCors === false ? n.data.image : imgUrl(n.data.image); n.img = im; } });

  document.getElementById('sub').textContent =
    `Bob’s Buddhism Pop-up Series · Tibet House US · 2026 · ${nodes.length} nodes · ${links.length} links · session 1 of 6 catalogued`;

  // ---------- simulation ----------
  const bob = byId.get('agent:thurman-raf'); bob.fx = 0; bob.fy = 0;
  const ms0 = nodes.filter(n => n.type === 'moment'), total = toSec(D.item.duration);
  ms0.forEach(n => { const a = -Math.PI / 2 + 2 * Math.PI * toSec(n.data.start) / total; n.x = 300 * Math.cos(a); n.y = 300 * Math.sin(a); });
  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id)
      .distance(l => l.kind === 'about' ? 260 : l.kind === 'part' ? 300 : l.kind === 'presents' ? 110 : l.kind === 'bio' ? 90 : 70)
      .strength(l => l.kind === 'about' || l.kind === 'part' ? 0 : .18))
    .force('charge', d3.forceManyBody().strength(d => d.type === 'moment' ? -90 : -140 - d.deg * 10).distanceMax(700))
    .force('collide', d3.forceCollide(d => d.r + 6))
    .force('ring', d3.forceRadial(d => d.type === 'moment' ? 300 : d.type === 'session' ? 620 : 0).strength(d => d.type === 'moment' ? .9 : d.type === 'session' ? .5 : 0))
    .force('x', d3.forceX(0).strength(d => d.type === 'moment' || d.type === 'session' ? 0 : .012))
    .force('y', d3.forceY(0).strength(d => d.type === 'moment' || d.type === 'session' ? 0 : .012))
    .stop();
  for (let i = 0; i < 500; i++) sim.tick();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- canvas ----------
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1, T = d3.zoomIdentity;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * DPR; canvas.height = H * DPR; draw();
  }
  const HK = { refresh: () => {}, fly: null };
  const hidden = new Set();
  const visible = n => !hidden.has(groupOf(n.type)) || n.type === 'bob';
  let hover = null, selected = null;
  const focusSet = () => { const f = selected || hover; if (!f) return null; const s = new Set(nbrs.get(f.id)); s.add(f.id); return s; };

  // background star dust, fixed per load
  const dust = Array.from({ length: 220 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * .9 + .2, a: Math.random() * .35 + .05 }));

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * .7);
    g.addColorStop(0, '#111628'); g.addColorStop(1, tok('--sky'));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    dust.forEach(d => { ctx.globalAlpha = d.a; ctx.fillStyle = '#cfd6ff'; ctx.beginPath(); ctx.arc(d.x * W, d.y * H, d.r, 0, 6.283); ctx.fill(); });
    ctx.globalAlpha = 1;

    ctx.translate(T.x, T.y); ctx.scale(T.k, T.k);
    const F = focusSet();

    // links: soft curved filaments, additive
    ctx.globalCompositeOperation = 'lighter';
    links.forEach(l => {
      const a = l.source, b = l.target; if (!visible(a) || !visible(b)) return;
      const on = F && F.has(a.id) && F.has(b.id) && (a === (selected || hover) || b === (selected || hover));
      const textLink = l.kind === 'cites' || l.kind === 'locus' || l.kind === 'translation' || l.kind === 'related' || l.kind === 'bio';
      let alpha = l.kind === 'about' ? .05 : l.kind === 'part' ? .035 : textLink ? .42 : .16;
      if (F) alpha = on ? .75 : alpha * .25;
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y;
      const cx = mx - dy * .12, cy = my + dx * .12;
      const grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      grad.addColorStop(0, a.color); grad.addColorStop(1, b.color);
      ctx.strokeStyle = grad; ctx.globalAlpha = alpha; ctx.lineWidth = (on ? 1.4 : .7) / Math.sqrt(T.k);
      ctx.setLineDash(l.kind === 'locus' || l.kind === 'translation' ? [3 / T.k, 3 / T.k] : []);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(cx, cy, b.x, b.y); ctx.stroke();
    });

    ctx.setLineDash([]);
    // nodes: glow + core
    nodes.forEach(n => {
      if (!visible(n)) return;
      const dim = F && !F.has(n.id);
      ctx.globalAlpha = dim ? .18 : 1;
      const glow = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * 3.2);
      glow.addColorStop(0, n.color); glow.addColorStop(.35, n.color + '55'); glow.addColorStop(1, n.color + '00');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(n.x, n.y, n.r * 3.2, 0, 6.283); ctx.fill();
    });
    ctx.globalCompositeOperation = 'source-over';
    nodes.forEach(n => {
      if (!visible(n)) return;
      const dim = F && !F.has(n.id);
      ctx.globalAlpha = dim ? .25 : 1;
      if (n.img && n.img.complete && n.img.naturalWidth) {
        ctx.save(); ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 6.283); ctx.clip();
        { const [sx, sy, sw, sh] = srcRect(n, n.img), k = Math.max(2 * n.r / sw, 2 * n.r / sh); ctx.drawImage(n.img, sx, sy, sw, sh, n.x - sw * k / 2, n.y - sh * k / 2, sw * k, sh * k); } ctx.restore();
        ctx.strokeStyle = n.color; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 6.283); ctx.stroke();
      } else {
        ctx.fillStyle = n.type === 'session' ? tok('--sky') : n.color;
        ctx.beginPath(); ctx.arc(n.x, n.y, n.type === 'moment' ? n.r : n.r * .62, 0, 6.283); ctx.fill();
        if (n.type === 'session') { ctx.strokeStyle = n.color; ctx.lineWidth = 1.4; ctx.stroke(); }
        if (n.type === 'person' && n.r * T.k > 9) {
          ctx.fillStyle = tok('--sky'); ctx.font = `600 ${n.r * .62}px ${tok('--ui')}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(n.label.split(/[\s,]+/).filter(w => /^[A-Z]/.test(w)).slice(0, 2).map(w => w[0]).join(''), n.x, n.y + .5);
        }
      }
      if (n.data.bobVoice) { ctx.strokeStyle = TYPES.bob.color; ctx.lineWidth = 1.6 / Math.sqrt(T.k); ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 3.5, 0, 6.283); ctx.stroke(); }
      if (n === selected) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5 / T.k; ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 4 / T.k, 0, 6.283); ctx.stroke(); }
    });

    // labels
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    nodes.forEach(n => {
      if (!visible(n)) return;
      const f = F && F.has(n.id);
      const show = n.type === 'bob' || f || (!F && ((n.type !== 'moment' && n.deg * T.k >= 7) || (n.type === 'moment' && T.k > 2.2)));
      if (!show) return;
      const size = (n.type === 'bob' ? 16 : n.type === 'moment' ? 10 : 11.5) / Math.sqrt(T.k);
      ctx.font = `${n.type === 'bob' ? 'italic 400' : '500'} ${size}px ${n.type === 'bob' ? tok('--display') : tok('--ui')}`;
      ctx.globalAlpha = F && !f ? .2 : n.type === 'moment' ? .7 : .92;
      let txt = n.type === 'bob' ? 'Robert A. F. Thurman' : n.label; if (txt.length > 34) txt = txt.slice(0, 32) + '…';
      ctx.fillStyle = '#000'; ctx.fillText(txt, n.x + .6, n.y + n.r + 4.6);
      ctx.fillStyle = n.type === 'moment' ? tok('--ink-dim') : tok('--ink'); ctx.fillText(txt, n.x, n.y + n.r + 4);
    });
    ctx.globalAlpha = 1; ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  // ---------- interaction ----------
  const zoom = d3.zoom().scaleExtent([.25, 6]).on('zoom', e => { T = e.transform; draw(); });
  const sel = d3.select(canvas).call(zoom).on('dblclick.zoom', null);
  function fit() {
    const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
    const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
    const [x0, x1, y0, y1] = [q(xs, .02), q(xs, .98), q(ys, .02), q(ys, .98)];
    const k = Math.max(.3, Math.min(W / (x1 - x0 + 160), Math.max(H - 150, H * .6) / (y1 - y0 + 120), 1.6));
    sel.call(zoom.transform, d3.zoomIdentity.translate(W / 2 - k * (x0 + x1) / 2, H / 2 + 20 - k * (y0 + y1) / 2).scale(k));
  }
  function pick(ev) {
    const [px, py] = T.invert(d3.pointer(ev, canvas)); let best = null, bd = Infinity;
    nodes.forEach(n => { if (!visible(n)) return; const d = Math.hypot(n.x - px, n.y - py); if (d < Math.max(n.r + 4, 8 / T.k) && d < bd) { bd = d; best = n; } });
    return best;
  }
  canvas.addEventListener('mousemove', ev => { const n = pick(ev); if (n !== hover) { hover = n; canvas.classList.toggle('pointing', !!n); draw(); } });
  canvas.addEventListener('mouseleave', () => { hover = null; draw(); });

  // ---------- panel ----------
  const panel = document.getElementById('panel');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const name = id => (byId.get(id) || { label: id }).label;

  const momentRow = p => `<button class="row" data-id="${p.id}"><span class="t">${p.data.start}</span><span>${esc(p.label)}<span class="k">${esc((p.data.speakers || []).map(name).join(', '))}</span></span></button>`;

  const REL = { quotes: 'Quotes', paraphrases: 'Paraphrases', 'alludes to': 'Alludes to', discusses: 'Discusses', names: 'Names', corroborates: 'Corroborated by' };
  const linksOf = w => (w.links || []).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(' · ');
  const ids = w => { const i = w.identifiers || {}; return Object.entries(i).filter(([, v]) => v).map(([k, v]) => `<span class="mono">${esc({ toh: 'Toh', bdrc: 'BDRC', isbn: 'ISBN', suttacentral: 'SuttaCentral', oclc: 'OCLC' }[k] || k)} ${esc(v)}</span>`).join(' · '); };
  function citeCard(c, from) {
    const w = byId.get(c.target), m = byId.get(c.passage);
    const head = from === 'moment'
      ? `<button class="row simple" data-id="${w.id}" style="--c:${w.color};padding-left:0"><span class="dot"></span><span><b>${esc(w.label)}</b>${c.locator ? ` <span class="mono">${esc(c.locator)}</span>` : ''}</span></button>`
      : `<button class="row" data-id="${m.id}" style="padding-left:0"><span class="t">${c.at}</span><span>${esc(m.label)}<span class="k">${esc(m.data.speakers.map(name).join(', '))}${c.locator ? ' · ' + esc(c.locator) : ''}</span></span></button>`;
    const wl = w.data.links && from === 'moment' ? `<div style="font-size:12.5px;margin-top:4px">${linksOf(w.data)}</div>` : '';
    return `<div class="cite"><span class="badge rel">${REL[c.relation] || esc(c.relation)}</span>${c.confidence && c.confidence !== 'certain' ? ` <span class="k">${esc(c.confidence)}</span>` : ''}${head}<p>${esc(c.says)}</p>${c.note ? `<p class="k">${esc(c.note)}</p>` : ''}${wl}</div>`;
  }
  const PRED = {
    taught_at: ['taught at', 'taught here'], student_of: ['student of', 'teacher of'], ordained_by: ['ordained by', 'ordained'],
    co_founded: ['co-founded', 'co-founded by'], married_to: ['married to', 'married to'], child_of: ['child of', 'parent of'],

  function relRows(n) {

      const verb = (PRED[r.predicate] || [r.predicate, r.predicate])[fwd ? 0 : 1];

      if (d.note) h += `<p style="margin-top:12px">${esc(d.note)}</p>`;
      if (d.links && d.links.length) h += `<h3>Read or find it</h3><p>${linksOf(d)}</p>`;
