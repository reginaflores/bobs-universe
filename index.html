<title>Bob's Universe</title>
<style>
  :root{color-scheme:dark;--sky:#070910;--ink:#e9e4d8;--dim:#9a9aa8;--rule:#262b3d;--gold:#f0c36a;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:radial-gradient(ellipse at center,#111628 0%,var(--sky) 70%);color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .gate{max-width:380px;width:100%;text-align:center;}
  h1{font-size:30px;font-weight:400;margin-bottom:6px;} h1 i{color:var(--gold);}
  p{font-size:14px;color:var(--dim);margin-bottom:24px;line-height:1.5;font-family:"Helvetica Neue",Arial,sans-serif;}
  form{display:flex;flex-direction:column;gap:12px;}
  input{font-family:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--rule);background:#0e1220;color:var(--ink);border-radius:999px;text-align:center;letter-spacing:.04em;}
  input:focus{outline:2px solid #6fa8ff;outline-offset:1px;}
  button{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.14em;font-weight:700;color:#070910;background:var(--gold);border:none;border-radius:999px;padding:13px;cursor:pointer;}
  .err{color:#ff8f8f;font-size:13px;min-height:18px;font-family:"Helvetica Neue",Arial,sans-serif;}
  .foot{margin-top:22px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:var(--dim);letter-spacing:.04em;}
</style>
</head>

<main class="gate">
  <h1>Bob’s <i>Universe</i></h1>
  <p>Bob’s Buddhism Pop-up Series · a prototype for the Thurman Archive. Confidential working draft.</p>

    <button type="submit">Enter</button>
    <div class="err" id="err" role="alert"></div>
  </form>

</main>

const b64ToBytes = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  try {
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey('raw', enc.encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64ToBytes(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256' }, km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const buf = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64ToBytes(PAYLOAD.iv) }, key, b64ToBytes(PAYLOAD.ct));
    const html = new TextDecoder().decode(buf);
    document.open(); document.write(html); document.close();
  } catch (ex) { err.textContent = 'Incorrect password. Please try again.'; }
});
